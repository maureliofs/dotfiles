;==========================================================
;   Polybar — Tema One Dark
;   Estrutura: [workspaces] | [título da janela] | [cpu mem disco data dunst tray]
;==========================================================

[colors]
; --- Paleta One Dark ---
bg          = #282c34
bg-alt      = #2c313c
fg          = #abb2bf
fg-dim      = #5c6370

red         = #e06c75
green       = #98c379
yellow      = #e5c07b
blue        = #61afef
purple      = #c678dd
cyan        = #56b6c2
white       = #abb2bf

; --- Atalhos ---
primary     = ${colors.blue}
secondary   = ${colors.green}
alert       = ${colors.red}
warning     = ${colors.yellow}
disabled    = ${colors.fg-dim}

;----------------------------------------------------------
; BAR
;----------------------------------------------------------
[bar/main]
monitor     = ${env:MONITOR:}

width       = 100%
height      = 25
offset-x    = 0
offset-y    = 0

background  = ${colors.bg}
foreground  = ${colors.fg}

line-size   = 2
line-color  = ${colors.primary}

border-size        = 0
border-bottom-size = 2
border-bottom-color = ${colors.bg-alt}

padding-left  = 0
padding-right = 0

module-margin-left  = 0
module-margin-right = 0

; Nerd Font obrigatório para os ícones
font-0 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"

modules-left   = i3
modules-center = xwindow
modules-right  = cpu sep memory sep disk sep pulseaudio2 sep date sep dunst sep tray

separator            = ""
separator-foreground = ${colors.disabled}

tray-position    = right
tray-padding     = 4
tray-background  = ${colors.bg}
tray-maxsize     = 16

cursor-click  = pointer
cursor-scroll = ns-resize

wm-restack    = i3
override-redirect = false

enable-ipc = true

;----------------------------------------------------------
; WORKSPACES — i3
;----------------------------------------------------------
[module/i3]
type = internal/i3

format          = <label-state> <label-mode>
format-padding  = 1

index-sort     = true
pin-workspaces = true
fuzzy-match    = true

; Workspace em foco
; label-unfocused            = " %index% "
label-focused            = " %name%  "
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.blue}
label-focused-underline  = ${colors.cyan}

; Workspace com janelas mas sem foco
; label-unfocused            = " %index% "
label-unfocused            = " %name%  "
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-background = ${colors.bg-alt}

; Workspace visível em outro monitor
label-visible            = " %name%  "
label-visible-foreground = ${colors.fg}
label-visible-background = ${colors.bg-alt}
label-visible-underline  = ${colors.fg-dim}

; Workspace com janela urgente
label-urgent            = " %name%  "
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}

; Modo do i3 (resize, etc.)
label-mode            = "  %mode% "
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.yellow}
label-mode-padding    = 1

;----------------------------------------------------------
; TÍTULO DA JANELA
;----------------------------------------------------------
[module/xwindow]
type = internal/xwindow

label                  = "  %title:0:70:…%"
label-foreground       = ${colors.fg}
label-empty            = "  Desktop"
label-empty-foreground = ${colors.fg-dim}

format-padding = 2

;----------------------------------------------------------
; CPU
;----------------------------------------------------------
[module/cpu]
type     = internal/cpu
interval = 2

format        = "<label>"
format-prefix = " "
format-prefix-foreground = ${colors.blue}
format-padding = 1

label            = %percentage%%
label-foreground = ${colors.fg}

; Muda de cor quando alto
format-warn        = "<label-warn>"
format-warn-prefix = "  "
format-warn-prefix-foreground = ${colors.red}
format-warn-padding = 1
label-warn            = %percentage%%
label-warn-foreground = ${colors.red}

warn-percentage = 80

;----------------------------------------------------------
; MEMÓRIA
;----------------------------------------------------------
[module/memory]
type     = internal/memory
interval = 3

format        = "<label>"
format-prefix = " "
format-prefix-foreground = ${colors.purple}
format-padding = 1

label            = %percentage_used%%
label-foreground = ${colors.fg}

format-warn        = "<label-warn>"
format-warn-prefix = "  "
format-warn-prefix-foreground = ${colors.red}
format-warn-padding = 1
label-warn            = %percentage_used%%
label-warn-foreground = ${colors.red}

warn-percentage = 85

;----------------------------------------------------------
; DISCO — partição /
;----------------------------------------------------------
[module/disk]
type     = internal/fs
interval = 30

mount-0 = /

format-mounted        = "<label-mounted>"
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.green}
format-mounted-padding = 1

label-mounted            = %percentage_used%%
label-mounted-foreground = ${colors.fg}

format-warn        = "<label-warn>"
format-warn-prefix = "  "
format-warn-prefix-foreground = ${colors.red}
format-warn-padding = 1
label-warn            = %percentage_used%%
label-warn-foreground = ${colors.red}

warn-percentage = 90

;----------------------------------------------------------
; PULSEAUDIO
;----------------------------------------------------------

[module/pulseaudio1]
type = internal/pulseaudio

; Formato quando o som está ativo
format-volume = <label-volume> <bar-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.accent}
format-volume-background = ${colors.surface}
format-volume-padding = 1

; Formato quando está mutado
format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.red}
format-muted-background = ${colors.surface}
format-muted-padding = 1

label-volume = %percentage%%
label-muted = "Muted"
label-muted-foreground = ${colors.subtext}

; Barra de volume (opcional, visual "clean")
bar-volume-width = 10
bar-volume-foreground-0 = ${colors.green}
bar-volume-foreground-1 = ${colors.green}
bar-volume-foreground-2 = ${colors.yellow}
bar-volume-foreground-3 = ${colors.red}
bar-volume-gradient = false
bar-volume-indicator = |
bar-volume-indicator-font = 2
bar-volume-fill = ─
bar-volume-fill-font = 2
bar-volume-empty = ─
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.overlay}

; Interações
click-right = pavucontrol

[module/pulseaudio2]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.surface}
format-volume-padding = 1

label-volume = %percentage%%

format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.red}
format-muted-background = ${colors.surface}
format-muted-padding = 1
label-muted = "Muted"

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.accent}

click-right = pavucontrol

;----------------------------------------------------------
; DATA E HORA
;----------------------------------------------------------
[module/date]
type     = internal/date
interval = 30

; Clique alterna entre hora simples e data completa
date     =  %d %b %Y, %a %H:%M
date-alt =  %H:%M

label            = %date%
label-foreground = ${colors.fg}

format-padding = 1

click-left = polybar-msg hook date 1

;----------------------------------------------------------
; DUNST — notificações (toggle DND via clique)
;----------------------------------------------------------
[module/dunst]
type = custom/ipc
hook-0 = echo "%{A1:dunstctl set-paused true && polybar-msg hook dunst 2:}%{A}" &
hook-1 = echo "%{A1:dunstctl set-paused false && polybar-msg hook dunst 1:}%{A}" &
initial = 1
format-padding = 1
format-foreground = ${colors.yellow}

;----------------------------------------------------------
; SEPARADOR VISUAL (opcional — usado entre módulos)
;----------------------------------------------------------
[module/sep]
type = custom/text
content = "|"
content-foreground = ${colors.white}
